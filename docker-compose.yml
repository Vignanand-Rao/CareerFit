services:
  db:
    image: postgres:16-alpine
    container_name: careerfit-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: careerfit_secret_password
      POSTGRES_DB: careerfit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: careerfit-backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:careerfit_secret_password@db:5432/careerfit
      - JWT_SECRET=production-careerfit-jwt-secret-key-32-chars-long
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerfit-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
